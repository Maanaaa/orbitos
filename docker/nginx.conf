# Vhost OrbitOS — démarre avec le conteneur.
# Le contrôle des noms d'hôte autorisés est fait par l'application (ORBIT_HOSTS).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Derrière un reverse proxy TLS (VPS), on conserve le schéma d'origine.
map $http_x_forwarded_proto $orbit_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
# IP client : X-Real-IP posé par le reverse proxy amont (écrasé par lui), sinon l'IP directe.
map $http_x_real_ip $orbit_client_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 4g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $orbit_client_ip;
        proxy_set_header X-Forwarded-For $orbit_client_ip;
        proxy_set_header X-Forwarded-Proto $orbit_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
