# OrbitOS — un seul conteneur : nginx + serveur Node. Démarrage :
#   cp .env.example .env   (choisis ORBIT_PASSWORD)
#   docker compose up -d --build
#   → http://localhost:8080
services:
  orbitos:
    build: .
    image: orbitos:latest
    container_name: orbitos
    restart: unless-stopped
    ports:
      # Lié à 127.0.0.1 : OrbitOS n'est pas exposé au réseau. Pour un accès distant, mets un
      # reverse proxy TLS + SSO/VPN devant (voir README), jamais le port brut.
      - "127.0.0.1:${ORBIT_HTTP_PORT:-8080}:80"
    environment:
      ORBIT_PASSWORD: ${ORBIT_PASSWORD:?Définis ORBIT_PASSWORD dans .env}
      ORBIT_HOSTS: ${ORBIT_HOSTS:-localhost,127.0.0.1}
      ORBIT_READONLY: ${ORBIT_READONLY:-0}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Clés et config SSH en lecture seule (jamais copiées dans l'image). Sur un serveur, pointe
      # vers un dossier dédié contenant config, known_hosts et la clé d'OrbitOS.
      - ${ORBIT_SSH_DIR:-${HOME}/.ssh}:/ssh:ro
      # Serveurs ajoutés, réglages, journal, secrets (tokens, mot de passe), clés d'hôte mémorisées
      - orbitos-data:/data

volumes:
  orbitos-data:
